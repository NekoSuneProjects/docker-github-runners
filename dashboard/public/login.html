<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Neko Runner Dashboard Login</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080b12;
      color: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(99, 102, 241, .16), transparent 34rem),
        #080b12;
    }
    .card {
      width: min(100%, 420px);
      border: 1px solid #20283a;
      border-radius: 20px;
      background: rgba(14, 18, 29, .96);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
      padding: 30px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #c7d2fe;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .03em;
      text-transform: uppercase;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #818cf8;
      box-shadow: 0 0 16px rgba(129, 140, 248, .7);
    }
    h1 {
      margin: 16px 0 8px;
      font-size: 28px;
      line-height: 1.15;
    }
    .sub {
      margin: 0 0 24px;
      color: #94a3b8;
      line-height: 1.6;
      font-size: 14px;
    }
    label {
      display: block;
      margin: 16px 0 7px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
    }
    input {
      width: 100%;
      border: 1px solid #30394e;
      border-radius: 11px;
      background: #0b101a;
      color: #f8fafc;
      padding: 13px 14px;
      font: inherit;
      outline: none;
    }
    input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, .13);
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      margin-top: 20px;
      padding: 13px 16px;
      background: #6366f1;
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { background: #7375f3; }
    .error {
      min-height: 20px;
      margin: 16px 0 -2px;
      color: #fca5a5;
      font-size: 13px;
      line-height: 1.5;
    }
    .private {
      margin-top: 20px;
      border-top: 1px solid #20283a;
      padding-top: 18px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge"><span class="dot"></span> Private runner console</div>
    <h1>Neko Runner Dashboard</h1>
    <p class="sub">Sign in to view workers, builds, workflow errors, and runner logs.</p>

    <form method="post" action="/login" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <div class="error" role="alert">{{ERROR}}</div>
      <button type="submit">Sign in</button>
    </form>

    <div class="private">The dashboard and its GitHub Actions logs stay behind an HttpOnly signed session cookie. Failed login attempts are rate-limited.</div>
  </main>
</body>
</html>
