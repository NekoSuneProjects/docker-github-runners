name: Build Dashboard Image

on:
  push:
    branches: [dashboard]
    paths:
      - dashboard/**
      - .github/workflows/docker.yml
  workflow_dispatch:
    inputs:
      build_runner:
        description: Where should this image build run?
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted

concurrency:
  group: dashboard-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  dashboard:
    name: Build Dashboard AMD64 + ARM64 (${{ github.event_name == 'workflow_dispatch' && inputs.build_runner || 'self-hosted' }})
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.build_runner == 'github-hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","docker","buildx"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/nekosuneprojects/docker-github-runners-dashboard
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=min,scope=dashboard
          provenance: false
          sbom: false
