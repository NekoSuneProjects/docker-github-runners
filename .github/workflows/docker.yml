name: Build Node Agent Image

on:
  push:
    branches: [agent]
    paths:
      - node-agent/**
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  agent:
    runs-on: [self-hosted, linux, docker, buildx]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/nekosuneprojects/docker-github-runners-node-agent
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # The agent image is intentionally tiny. Avoid GHA cache import/export here:
      # cache transfer can take longer than rebuilding the few Alpine layers on a
      # slow self-hosted VPS and gives us another place for a build to stall.
      - name: Build and push AMD64 + ARM64 agent
        uses: docker/build-push-action@v6
        with:
          context: ./node-agent
          file: ./node-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
