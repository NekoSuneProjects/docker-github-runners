name: Manual Component Build

on:
  workflow_dispatch:
    inputs:
      component:
        description: Which component image should be built?
        required: true
        default: dashboard
        type: choice
        options:
          - dashboard
          - agent
          - runner
      build_runner:
        description: Where should the build run?
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted

concurrency:
  group: manual-${{ inputs.component }}-${{ inputs.build_runner }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ inputs.component }} on ${{ inputs.build_runner }}
    runs-on: ${{ inputs.build_runner == 'github-hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","docker","buildx"]') }}
    timeout-minutes: 60

    steps:
      - name: Checkout selected component branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.component }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dashboard
        if: inputs.component == 'dashboard'
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nekosuneprojects/docker-github-runners-dashboard:latest
            ghcr.io/nekosuneprojects/docker-github-runners-dashboard:manual-${{ github.run_number }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=min,scope=dashboard
          provenance: false
          sbom: false

      - name: Build agent
        if: inputs.component == 'agent'
        uses: docker/build-push-action@v6
        with:
          context: ./node-agent
          file: ./node-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ghcr.io/nekosuneprojects/docker-github-runners-node-agent:latest
            ghcr.io/nekosuneprojects/docker-github-runners-node-agent:manual-${{ github.run_number }}
          provenance: false
          sbom: false

      - name: Build runner
        if: inputs.component == 'runner'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nekosuneprojects/docker-github-runners:latest
            ghcr.io/nekosuneprojects/docker-github-runners:manual-${{ github.run_number }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=min,scope=runner
          provenance: false
          sbom: false
