name: Build All Images Manually

on:
  workflow_dispatch:

concurrency:
  group: docker-images-manual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-all:
    name: Manual Runner + Dashboard + Agent build
    runs-on: [self-hosted, linux, docker, buildx]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@v3

      - name: Build runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nekosuneprojects/docker-github-runners:latest
          provenance: false
          sbom: false

      - name: Build dashboard
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nekosuneprojects/docker-github-runners-dashboard:latest
          provenance: false
          sbom: false

      - name: Build node agent
        uses: docker/build-push-action@v6
        with:
          context: ./node-agent
          file: ./node-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nekosuneprojects/docker-github-runners-node-agent:latest
          provenance: false
          sbom: false
