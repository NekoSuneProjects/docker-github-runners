services:
  runner:
    image: ${RUNNER_IMAGE:-ghcr.io/nekosuneprojects/docker-github-runners:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      RUNNER_AUTH_MODE: ${RUNNER_AUTH_MODE:-broker}
      RUNNER_REGISTRATION_TOKEN: ${RUNNER_REGISTRATION_TOKEN:-}
      RUNNER_CONFIG_URL: ${RUNNER_CONFIG_URL:-}

      RUNNER_SCOPE: ${RUNNER_SCOPE:-organization}
      RUNNER_NAME: ${RUNNER_NAME:-neko-builder}
      LABELS: ${LABELS:-docker,buildx,multiarch,builder}

      RUNNER_UPDATE_ON_START: ${RUNNER_UPDATE_ON_START:-true}
      ENABLE_MULTIARCH_ON_START: ${ENABLE_MULTIARCH_ON_START:-true}
      MULTIARCH_PLATFORMS: ${MULTIARCH_PLATFORMS:-arm64,amd64}

      NODE_SHARED_JOB_LOCK: ${NODE_SHARED_JOB_LOCK:-true}
      NODE_SHARED_LOCK_DIR: ${NODE_SHARED_LOCK_DIR:-/runner-lock}
      NODE_SHARED_LOCK_STALE_SECONDS: ${NODE_SHARED_LOCK_STALE_SECONDS:-259200}

      # Standalone/API mode only. Leave blank in broker mode.
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      GITHUB_ORG: ${GITHUB_ORG:-}
      REPO_URL: ${REPO_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/work
      - runner-diag:/actions-runner/_diag
      - runner-lock:/runner-lock
    init: true
    stop_grace_period: 35s
    restart: unless-stopped

volumes:
  runner-work:
  runner-diag:
  runner-lock:
