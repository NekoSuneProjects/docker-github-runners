services:
  dashboard:
    image: ${DASHBOARD_IMAGE:-neko-github-runner-dashboard:latest}
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    environment:
      GITHUB_ORG: ${GITHUB_ORG:-}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      GITHUB_DASHBOARD_TOKEN: ${GITHUB_DASHBOARD_TOKEN:-}

      # Central GitHub credential broker. These secrets stay on the dashboard.
      GITHUB_AUTH_MODE: ${GITHUB_AUTH_MODE:-token}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_BASE64: ${GITHUB_APP_PRIVATE_KEY_BASE64:-}
      GITHUB_ORGS: ${GITHUB_ORGS:-}
      GITHUB_ORG_INCLUDE: ${GITHUB_ORG_INCLUDE:-}
      GITHUB_ORG_EXCLUDE: ${GITHUB_ORG_EXCLUDE:-}
      GITHUB_PERSONAL_REPOS: ${GITHUB_PERSONAL_REPOS:-}
      GITHUB_PERSONAL_REPO_INCLUDE: ${GITHUB_PERSONAL_REPO_INCLUDE:-}
      GITHUB_PERSONAL_REPO_EXCLUDE: ${GITHUB_PERSONAL_REPO_EXCLUDE:-}
      GITHUB_PERSONAL_INCLUDE_ARCHIVED: ${GITHUB_PERSONAL_INCLUDE_ARCHIVED:-false}
      DASHBOARD_REPOS: ${DASHBOARD_REPOS:-}
      DASHBOARD_MAX_REPOS: ${DASHBOARD_MAX_REPOS:-12}
      DASHBOARD_REFRESH_SECONDS: ${DASHBOARD_REFRESH_SECONDS:-120}
      DASHBOARD_LIVE_GITHUB_SECONDS: ${DASHBOARD_LIVE_GITHUB_SECONDS:-300}
      DASHBOARD_SSE_KEEPALIVE_SECONDS: ${DASHBOARD_SSE_KEEPALIVE_SECONDS:-30}
      DASHBOARD_WS_PING_SECONDS: ${DASHBOARD_WS_PING_SECONDS:-30}
      DASHBOARD_GITHUB_CACHE_SECONDS: ${DASHBOARD_GITHUB_CACHE_SECONDS:-60}
      DASHBOARD_GITHUB_RUNS_CACHE_SECONDS: ${DASHBOARD_GITHUB_RUNS_CACHE_SECONDS:-120}
      DASHBOARD_GITHUB_JOBS_CACHE_SECONDS: ${DASHBOARD_GITHUB_JOBS_CACHE_SECONDS:-60}
      DASHBOARD_GITHUB_RUNNERS_CACHE_SECONDS: ${DASHBOARD_GITHUB_RUNNERS_CACHE_SECONDS:-120}
      DASHBOARD_GITHUB_REPOS_CACHE_SECONDS: ${DASHBOARD_GITHUB_REPOS_CACHE_SECONDS:-600}
      DASHBOARD_GITHUB_STALE_SECONDS: ${DASHBOARD_GITHUB_STALE_SECONDS:-1800}
      DASHBOARD_GITHUB_RATE_RESERVE: ${DASHBOARD_GITHUB_RATE_RESERVE:-750}
      DASHBOARD_GITHUB_PERSIST_FRESH_SECONDS: ${DASHBOARD_GITHUB_PERSIST_FRESH_SECONDS:-120}
      DASHBOARD_GITHUB_PERSIST_STALE_SECONDS: ${DASHBOARD_GITHUB_PERSIST_STALE_SECONDS:-86400}
      DASHBOARD_GITHUB_PERSIST_MAX_ROWS: ${DASHBOARD_GITHUB_PERSIST_MAX_ROWS:-1000}
      DASHBOARD_GITHUB_RUNNER_SYNC_SECONDS: ${DASHBOARD_GITHUB_RUNNER_SYNC_SECONDS:-300}
      DASHBOARD_GITHUB_RUNNER_MAX_PAGES: ${DASHBOARD_GITHUB_RUNNER_MAX_PAGES:-100}
      DASHBOARD_GITHUB_WORKFLOW_SYNC_SECONDS: ${DASHBOARD_GITHUB_WORKFLOW_SYNC_SECONDS:-180}
      DASHBOARD_NODE_WORKFLOW_SYNC_SECONDS: ${DASHBOARD_NODE_WORKFLOW_SYNC_SECONDS:-60}
      DASHBOARD_GITHUB_WORKFLOW_RUNS_PER_REPO: ${DASHBOARD_GITHUB_WORKFLOW_RUNS_PER_REPO:-8}
      DASHBOARD_GITHUB_WEBHOOK_SECRET: ${DASHBOARD_GITHUB_WEBHOOK_SECRET:-}
      DASHBOARD_AUTH_REQUIRED: ${DASHBOARD_AUTH_REQUIRED:-true}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_PASSWORD_SHA256: ${DASHBOARD_PASSWORD_SHA256:-}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-}
      DASHBOARD_SESSION_TTL_HOURS: ${DASHBOARD_SESSION_TTL_HOURS:-12}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-false}
      DASHBOARD_NODE_SHARED_SECRET: ${DASHBOARD_NODE_SHARED_SECRET:-}
      DASHBOARD_NODE_OFFLINE_SECONDS: ${DASHBOARD_NODE_OFFLINE_SECONDS:-45}
      DASHBOARD_NODE_MAX_LOG_BYTES: ${DASHBOARD_NODE_MAX_LOG_BYTES:-262144}
      DASHBOARD_NODE_MAX_BODY_BYTES: ${DASHBOARD_NODE_MAX_BODY_BYTES:-1048576}
      DASHBOARD_DB_FILE: /data/dashboard.sqlite
      DASHBOARD_DATA_DIR: /data
      DASHBOARD_LOG_RETENTION_DAYS: ${DASHBOARD_LOG_RETENTION_DAYS:-30}
      DASHBOARD_LOG_MAX_ROWS_PER_NODE: ${DASHBOARD_LOG_MAX_ROWS_PER_NODE:-500}
      RUNNER_DIAG_DIR: /runner-diag
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - runner-diag:/runner-diag:ro
      - ./data:/data
    init: true
    stop_grace_period: 10s
    restart: unless-stopped

  node-agent:
    image: ${NODE_AGENT_IMAGE:-neko-github-runner-node-agent:latest}
    build:
      context: ./node-agent
      dockerfile: Dockerfile
    environment:
      DASHBOARD_URL: http://dashboard:8080
      DASHBOARD_NODE_SHARED_SECRET: ${DASHBOARD_NODE_SHARED_SECRET:-}

      NODE_ID: ${NODE_ID:-central-node}
      NODE_NAME: ${NODE_NAME:-Central GitHub Builder}
      NODE_LOCATION: ${NODE_LOCATION:-}
      NODE_FLEET_MODE: "true"

      RUNNER_IMAGE: ${RUNNER_IMAGE:-ghcr.io/nekosuneprojects/docker-github-runners:latest}
      RUNNER_NAME_PREFIX: ${RUNNER_NAME_PREFIX:-${NODE_ID:-central-node}}
      LABELS: ${LABELS:-docker,buildx,multiarch,builder}
      RUNNER_UPDATE_ON_START: ${RUNNER_UPDATE_ON_START:-true}
      ENABLE_MULTIARCH_ON_START: ${ENABLE_MULTIARCH_ON_START:-true}
      MULTIARCH_PLATFORMS: ${MULTIARCH_PLATFORMS:-arm64,amd64}

      NODE_RUNNER_WORK_VOLUME: ${NODE_ID:-central-node}-runner-work
      NODE_RUNNER_DIAG_VOLUME: ${NODE_ID:-central-node}-runner-diag
      NODE_RUNNER_LOCK_VOLUME: ${NODE_ID:-central-node}-runner-lock
      NODE_SHARED_LOCK_STALE_SECONDS: ${NODE_SHARED_LOCK_STALE_SECONDS:-259200}
      NODE_FLEET_RECONCILE_SECONDS: ${NODE_FLEET_RECONCILE_SECONDS:-120}

      NODE_CAPACITY_CLASS: ${NODE_CAPACITY_CLASS:-auto}
      NODE_GPU: ${NODE_GPU:-auto}
      NODE_SMALL_MAX_CPU: ${NODE_SMALL_MAX_CPU:-2}
      NODE_SMALL_MAX_RAM_GB: ${NODE_SMALL_MAX_RAM_GB:-4}
      NODE_LARGE_MIN_CPU: ${NODE_LARGE_MIN_CPU:-8}
      NODE_LARGE_MIN_RAM_GB: ${NODE_LARGE_MIN_RAM_GB:-16}

      RUNNER_NAME: ${RUNNER_NAME_PREFIX:-${NODE_ID:-central-node}}
      RUNNER_SCOPE: organization
      GITHUB_ORG: ""
      ACCESS_TOKEN: ""

      NODE_LABELS: ${LABELS:-docker,buildx,multiarch,builder}
      NODE_HEARTBEAT_SECONDS: ${NODE_HEARTBEAT_SECONDS:-10}
      NODE_LOG_TAIL_BYTES: ${NODE_LOG_TAIL_BYTES:-131072}
      NODE_RUNNER_STATUS_CACHE_SECONDS: ${NODE_RUNNER_STATUS_CACHE_SECONDS:-90}
      RUNNER_DIAG_DIR: /runner-diag
      RUNNER_WORK_DIR: /runner-work
      NODE_SHARED_LOCK_DIR: /runner-lock
      NODE_HOST_ROOT: /host

      NODE_STUCK_WATCHDOG_ENABLED: ${NODE_STUCK_WATCHDOG_ENABLED:-true}
      NODE_STUCK_THRESHOLD_SECONDS: ${NODE_STUCK_THRESHOLD_SECONDS:-600}
      NODE_AUTO_RECOVER_STUCK: ${NODE_AUTO_RECOVER_STUCK:-false}
      NODE_STUCK_RECOVERY_COOLDOWN_SECONDS: ${NODE_STUCK_RECOVERY_COOLDOWN_SECONDS:-900}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-diag:/runner-diag
      - runner-work:/runner-work:ro
      - runner-lock:/runner-lock
      - /etc/hostname:/host/etc/hostname:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
    depends_on:
      - dashboard
    init: true
    stop_grace_period: 35s
    restart: unless-stopped

volumes:
  runner-work:
  runner-diag:
  runner-lock:
