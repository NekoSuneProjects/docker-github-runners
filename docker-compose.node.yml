# Remote runner node stack. Pulls the published runner + agent images and only
# connects outbound to the central dashboard.
services:
  github-builder:
    image: ${RUNNER_IMAGE:-ghcr.io/nekosuneprojects/docker-github-runners:latest}
    env_file:
      - .env
    environment:
      RUNNER_SCOPE: ${RUNNER_SCOPE:-organization}
      GITHUB_ORG: ${GITHUB_ORG}
      REPO_URL: ${REPO_URL:-}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      RUNNER_NAME: ${RUNNER_NAME:-neko-remote-builder}
      LABELS: ${LABELS:-docker,buildx,multiarch,builder}
      RUNNER_UPDATE_ON_START: ${RUNNER_UPDATE_ON_START:-true}
      ENABLE_MULTIARCH_ON_START: ${ENABLE_MULTIARCH_ON_START:-true}
      MULTIARCH_PLATFORMS: ${MULTIARCH_PLATFORMS:-arm64,amd64}
    labels:
      neko.runner.managed: "true"
      neko.runner.name: "${RUNNER_NAME:-neko-remote-builder}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/work
      - runner-diag:/actions-runner/_diag
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

  node-agent:
    image: ${NODE_AGENT_IMAGE:-ghcr.io/nekosuneprojects/docker-github-runners-node-agent:latest}
    env_file:
      - .env
    environment:
      DASHBOARD_URL: ${CENTRAL_DASHBOARD_URL}
      DASHBOARD_NODE_SHARED_SECRET: ${DASHBOARD_NODE_SHARED_SECRET}
      NODE_ID: ${NODE_ID}
      NODE_NAME: ${NODE_NAME:-Remote GitHub Builder}
      NODE_LOCATION: ${NODE_LOCATION:-}
      RUNNER_NAME: ${RUNNER_NAME:-neko-remote-builder}
      RUNNER_SCOPE: ${RUNNER_SCOPE:-organization}
      GITHUB_ORG: ${GITHUB_ORG}
      REPO_URL: ${REPO_URL:-}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      NODE_LABELS: ${LABELS:-docker,buildx,multiarch,builder}
      NODE_HEARTBEAT_SECONDS: ${NODE_HEARTBEAT_SECONDS:-10}
      NODE_LOG_TAIL_BYTES: ${NODE_LOG_TAIL_BYTES:-131072}
      NODE_RUNNER_STATUS_CACHE_SECONDS: ${NODE_RUNNER_STATUS_CACHE_SECONDS:-90}
      RUNNER_DIAG_DIR: /runner-diag
      RUNNER_WORK_DIR: /runner-work
      NODE_HOST_ROOT: /host
      NODE_STUCK_WATCHDOG_ENABLED: ${NODE_STUCK_WATCHDOG_ENABLED:-true}
      NODE_STUCK_THRESHOLD_SECONDS: ${NODE_STUCK_THRESHOLD_SECONDS:-600}
      NODE_AUTO_RECOVER_STUCK: ${NODE_AUTO_RECOVER_STUCK:-false}
      NODE_STUCK_RECOVERY_COOLDOWN_SECONDS: ${NODE_STUCK_RECOVERY_COOLDOWN_SECONDS:-900}
      NODE_AUTO_RECOVER_OFFLINE: ${NODE_AUTO_RECOVER_OFFLINE:-true}
      NODE_RUNNER_HEALTHCHECK_SECONDS: ${NODE_RUNNER_HEALTHCHECK_SECONDS:-30}
      NODE_RUNNER_OFFLINE_RECOVERY_SECONDS: ${NODE_RUNNER_OFFLINE_RECOVERY_SECONDS:-120}
      NODE_RUNNER_OFFLINE_RECOVERY_COOLDOWN_SECONDS: ${NODE_RUNNER_OFFLINE_RECOVERY_COOLDOWN_SECONDS:-600}
      NODE_RUNNER_CONTAINER_LABEL: neko.runner.managed=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-diag:/runner-diag
      - runner-work:/runner-work:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
    depends_on:
      - github-builder
    init: true
    stop_grace_period: 5s
    restart: unless-stopped

volumes:
  runner-work:
  runner-diag:
