# Remote runner node stack.
# Run this on any additional Linux AMD64/ARM64 machine that should appear in
# the central Neko Runner Dashboard.

services:
  github-builder:
    image: ${RUNNER_IMAGE:-ghcr.io/nekosuneprojects/docker-github-runners:latest}

    env_file:
      - .env

    environment:
      RUNNER_SCOPE: ${RUNNER_SCOPE:-organization}
      GITHUB_ORG: ${GITHUB_ORG}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      RUNNER_NAME: ${RUNNER_NAME:-neko-remote-builder}
      LABELS: ${LABELS:-docker,buildx,multiarch,builder}
      RUNNER_UPDATE_ON_START: ${RUNNER_UPDATE_ON_START:-true}

    command:
      - /bin/bash
      - /runner-dashboard-entrypoint.sh

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/work
      - runner-diag:/actions-runner/_diag
      - ./runner-dashboard-entrypoint.sh:/runner-dashboard-entrypoint.sh:ro

    restart: unless-stopped

  node-agent:
    image: ${NODE_AGENT_IMAGE:-ghcr.io/nekosuneprojects/docker-github-runners-node-agent:latest}

    env_file:
      - .env

    environment:
      # Public/private HTTPS address of the CENTRAL dashboard.
      DASHBOARD_URL: ${CENTRAL_DASHBOARD_URL}
      DASHBOARD_NODE_SHARED_SECRET: ${DASHBOARD_NODE_SHARED_SECRET}

      # Must be unique for every machine.
      NODE_ID: ${NODE_ID}
      NODE_NAME: ${NODE_NAME:-Remote GitHub Builder}
      NODE_LOCATION: ${NODE_LOCATION:-}

      RUNNER_NAME: ${RUNNER_NAME:-neko-remote-builder}
      NODE_LABELS: ${LABELS:-docker,buildx,multiarch,builder}
      NODE_HEARTBEAT_SECONDS: ${NODE_HEARTBEAT_SECONDS:-15}
      NODE_LOG_TAIL_BYTES: ${NODE_LOG_TAIL_BYTES:-131072}
      RUNNER_DIAG_DIR: /runner-diag
      NODE_HOST_ROOT: /host

    volumes:
      - runner-diag:/runner-diag:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro

    depends_on:
      - github-builder

    init: true
    stop_grace_period: 5s
    restart: unless-stopped

volumes:
  runner-work:
  runner-diag:
